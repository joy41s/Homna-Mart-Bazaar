openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Homna Mart customer and protected administration API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: catalog
  - name: checkout
  - name: admin
  - name: merchant
security:
  - ClerkSession: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      summary: List visible products
      security: []
      responses:
        "200":
          description: Visible catalog
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
  /shops:
    get:
      operationId: listShops
      tags: [catalog]
      summary: List active independent shops
      security: []
      responses:
        "200":
          description: Active shops and delivery settings
          content:
            application/json:
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShopSummary"
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      summary: List active product categories
      security: []
      responses:
        "200":
          description: Active categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
  /store-settings:
    get:
      operationId: getStoreSettings
      tags: [catalog]
      summary: Read public store and delivery settings
      security: []
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
  /payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [checkout]
      summary: List checkout methods and availability
      security: []
      responses:
        "200":
          description: Payment methods
          content:
            application/json:
              schema:
                type: object
                required: [methods]
                properties:
                  methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentMethodInfo"
  /discounts/preview:
    post:
      operationId: previewDiscount
      tags: [checkout]
      summary: Validate a discount code against the current basket
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, subtotal]
              properties:
                code:
                  type: string
                  minLength: 2
                  maxLength: 40
                subtotal:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Discount preview
          content:
            application/json:
              schema:
                type: object
                required: [code, discountAmount]
                properties:
                  code:
                    type: string
                  discountAmount:
                    type: number
        "400":
          description: Invalid code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    post:
      operationId: createOrder
      tags: [checkout]
      summary: Create a Cash on Delivery order
      description: Prices, discounts, delivery fees, and stock are recalculated on the server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderInput"
      responses:
        "201":
          description: Order accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderReceipt"
        "400":
          description: Invalid order or insufficient stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Payment method is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /my/orders:
    get:
      operationId: getMyOrders
      tags: [checkout]
      summary: List orders placed by the signed-in customer
      responses:
        "200":
          description: The caller's order history only
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/CustomerOrder"
  /admin/me:
    get:
      operationId: getAdminIdentity
      tags: [admin]
      summary: Confirm the signed-in user is an authorized administrator
      responses:
        "200":
          description: Authorized administrator
          content:
            application/json:
              schema:
                type: object
                required: [authorized, email]
                properties:
                  authorized:
                    type: boolean
                  email:
                    type: string
  /admin/shops:
    get:
      operationId: adminListShops
      tags: [admin]
      summary: List shops and merchant access
      responses:
        "200":
          description: Shops managed by the platform
          content:
            application/json:
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminShop"
    post:
      operationId: adminCreateShop
      tags: [admin]
      summary: Create an independent shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopInput"
      responses:
        "201":
          description: Created shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShop"
  /admin/shops/{shopId}:
    patch:
      operationId: adminUpdateShop
      tags: [admin]
      summary: Update shop details or suspend the shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopPatch"
      responses:
        "200":
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminShop"
  /admin/shops/{shopId}/members:
    post:
      operationId: adminAddShopMember
      tags: [admin]
      summary: Grant verified email access to a shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: Merchant access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopMember"
  /admin/shops/{shopId}/members/{memberId}:
    delete:
      operationId: adminRemoveShopMember
      tags: [admin]
      summary: Revoke a merchant's access to this shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Merchant access revoked
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Read sales and inventory summary
      responses:
        "200":
          description: Dashboard totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/products:
    get:
      operationId: adminListProducts
      tags: [admin]
      summary: List all products, including hidden products
      responses:
        "200":
          description: Full catalog
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
    post:
      operationId: adminCreateProduct
      tags: [admin]
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/products/{id}:
    patch:
      operationId: adminUpdateProduct
      tags: [admin]
      summary: Update product details, stock, visibility, or image
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: adminDeleteProduct
      tags: [admin]
      summary: Delete a product while preserving existing order snapshots
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Product deleted
  /admin/categories:
    get:
      operationId: adminListCategories
      tags: [admin]
      summary: List all categories
      responses:
        "200":
          description: All categories
          content:
            application/json:
              schema:
                type: object
                required: [categories]
                properties:
                  categories:
                    type: array
                    items:
                      $ref: "#/components/schemas/Category"
    post:
      operationId: adminCreateCategory
      tags: [admin]
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /admin/categories/{id}:
    patch:
      operationId: adminUpdateCategory
      tags: [admin]
      summary: Update category name, order, or visibility
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: Updated category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
    delete:
      operationId: adminDeleteCategory
      tags: [admin]
      summary: Delete a category
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Category deleted
  /admin/orders:
    get:
      operationId: adminListOrders
      tags: [admin]
      summary: Search orders and filter by status
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Matching orders with customer and line-item details
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminOrder"
  /admin/orders/{id}:
    patch:
      operationId: adminUpdateOrderStatus
      tags: [admin]
      summary: Update an order status or cancel it
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders/{id}/cod-payment:
    patch:
      operationId: adminConfirmCodPayment
      tags: [admin]
      summary: Record cash received for a COD order only
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: COD payment recorded
          content:
            application/json:
              schema:
                type: object
                required: [paymentStatus]
                properties:
                  paymentStatus:
                    $ref: "#/components/schemas/PaymentStatus"
        "409":
          description: Only COD payments can be confirmed manually
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/settings:
    get:
      operationId: adminGetSettings
      tags: [admin]
      summary: Read editable store settings
      responses:
        "200":
          description: Store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
    patch:
      operationId: adminUpdateSettings
      tags: [admin]
      summary: Update store name, delivery choices, fees, and minimum order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsPatch"
      responses:
        "200":
          description: Updated store settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreSettings"
  /admin/discounts:
    get:
      operationId: adminListDiscounts
      tags: [admin]
      summary: List discount codes
      responses:
        "200":
          description: Discount codes
          content:
            application/json:
              schema:
                type: object
                required: [discounts]
                properties:
                  discounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Discount"
    post:
      operationId: adminCreateDiscount
      tags: [admin]
      summary: Create a discount code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountInput"
      responses:
        "201":
          description: Created discount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
  /admin/discounts/{id}:
    patch:
      operationId: adminUpdateDiscount
      tags: [admin]
      summary: Update discount settings
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountPatch"
      responses:
        "200":
          description: Updated discount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
    delete:
      operationId: adminDeleteDiscount
      tags: [admin]
      summary: Delete a discount code
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Discount deleted
  /merchant/shops:
    get:
      operationId: merchantListShops
      tags: [merchant]
      summary: List shops assigned to the verified merchant account
      responses:
        "200":
          description: Authorized merchant shops
          content:
            application/json:
              schema:
                type: object
                required: [shops]
                properties:
                  shops:
                    type: array
                    items:
                      $ref: "#/components/schemas/ShopSummary"
  /merchant/shops/{shopId}/summary:
    get:
      operationId: merchantGetSummary
      tags: [merchant]
      summary: Read shop sales and inventory summary
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: Current shop totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /merchant/shops/{shopId}/products:
    get:
      operationId: merchantListProducts
      tags: [merchant]
      summary: List products owned by the selected shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: Shop products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
    post:
      operationId: merchantCreateProduct
      tags: [merchant]
      summary: Add a product to the selected shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantProductInput"
      responses:
        "201":
          description: Created product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /merchant/shops/{shopId}/products/{id}:
    patch:
      operationId: merchantUpdateProduct
      tags: [merchant]
      summary: Update a product belonging to the selected shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MerchantProductPatch"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: merchantDeleteProduct
      tags: [merchant]
      summary: Delete a product belonging to the selected shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Product deleted
  /merchant/shops/{shopId}/orders:
    get:
      operationId: merchantListOrders
      tags: [merchant]
      summary: Search orders for the selected shop only
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: Orders for this shop
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminOrder"
  /merchant/shops/{shopId}/orders/{id}:
    patch:
      operationId: merchantUpdateOrderStatus
      tags: [merchant]
      summary: Update status for an order belonging to the selected shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusPatch"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
  /merchant/shops/{shopId}/orders/{id}/cod-payment:
    patch:
      operationId: merchantConfirmCodPayment
      tags: [merchant]
      summary: Record cash received for a COD order in this shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: COD cash recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodPaymentReceipt"
  /merchant/shops/{shopId}/settings:
    get:
      operationId: merchantGetShopSettings
      tags: [merchant]
      summary: Read delivery settings for this shop
      parameters:
        - $ref: "#/components/parameters/ShopId"
      responses:
        "200":
          description: Shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
    patch:
      operationId: merchantUpdateShopSettings
      tags: [merchant]
      summary: Change the selected shop's delivery settings
      parameters:
        - $ref: "#/components/parameters/ShopId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSettingsPatch"
      responses:
        "200":
          description: Updated shop settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
components:
  securitySchemes:
    ClerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ShopId:
      name: shopId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    Product:
      type: object
      required: [id, slug, name, description, unit, price, stock, categoryId, categoryName, categorySlug, imageUrl, isVisible, shop]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        unit:
          type: string
        price:
          type: number
        stock:
          type: integer
        categoryId:
          type: integer
          nullable: true
        categoryName:
          type: string
          nullable: true
        categorySlug:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        shop:
          $ref: "#/components/schemas/ShopSummary"
          nullable: true
        isVisible:
          type: boolean
    ShopSummary:
      type: object
      required: [id, slug, name, description, deliveryCharge, minimumOrder, deliveryOptions]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        deliveryCharge:
          type: number
        minimumOrder:
          type: number
        deliveryOptions:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryOption"
    AdminShop:
      type: object
      required: [id, slug, name, description, deliveryCharge, minimumOrder, deliveryOptions, isActive, members]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        deliveryCharge:
          type: number
        minimumOrder:
          type: number
        deliveryOptions:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryOption"
        isActive:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/ShopMember"
    ShopMember:
      type: object
      required: [id, email, isActive]
      properties:
        id:
          type: integer
        email:
          type: string
        isActive:
          type: boolean
    ShopInput:
      type: object
      required: [slug, name, description, deliveryCharge, minimumOrder, deliveryOptions, isActive]
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        deliveryCharge:
          type: number
          minimum: 0
          maximum: 100000
        minimumOrder:
          type: number
          minimum: 0
          maximum: 10000000
        deliveryOptions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DeliveryOption"
        isActive:
          type: boolean
    ShopPatch:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          minLength: 2
          maxLength: 80
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        deliveryCharge:
          type: number
          minimum: 0
          maximum: 100000
        minimumOrder:
          type: number
          minimum: 0
          maximum: 10000000
        deliveryOptions:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/DeliveryOption"
        isActive:
          type: boolean
    ShopSettings:
      type: object
      required: [id, slug, name, description, deliveryCharge, minimumOrder, deliveryOptions]
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        deliveryCharge:
          type: number
        minimumOrder:
          type: number
        deliveryOptions:
          type: array
          items:
            $ref: "#/components/schemas/DeliveryOption"
    ShopSettingsPatch:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string
          maxLength: 500
        deliveryCharge:
          type: number
          minimum: 0
          maximum: 100000
        minimumOrder:
